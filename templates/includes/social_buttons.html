{# Botones de redes oficiales. Uso: {% include 'includes/social_buttons.html' with variant='light' %} #}
<div class="social-buttons {% if variant %}social-buttons-{{ variant }}{% endif %}">
    <a href="{{ SOCIAL_LINKS.instagram }}" class="social-btn social-instagram" target="_blank" rel="noopener noreferrer"
       aria-label="Instagram de {{ SITE_NAME }} (se abre en una pestaña nueva)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
        <span>Instagram</span>
    </a>
    <a href="{{ SOCIAL_LINKS.facebook }}" class="social-btn social-facebook" target="_blank" rel="noopener noreferrer"
       aria-label="Facebook de {{ SITE_NAME }} (se abre en una pestaña nueva)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M14 8.5V6.6c0-.8.2-1.3 1.4-1.3H17V2.2C16.7 2.1 15.7 2 14.6 2 12.2 2 10.6 3.4 10.6 6.1v2.4H8v3.4h2.6V22H14V11.9h2.7l.4-3.4H14z"/>
        </svg>
        <span>Facebook</span>
    </a>
</div>
